version: "3"

# Local development commands for Synod.
# Run `task` to list them.
#
# The test fixtures are ephemeral. Each one starts a container, runs the command,
# and removes the container. The development dependencies under `dev:` are
# persistent, because a local controller needs its metadata between runs.

vars:
  PG_CONTAINER: synod-dev-postgres
  PG_VOLUME: synod-dev-postgres-data
  PG_PORT: "55432"
  # Pinned to the digest that scripts/test-postgres.sh uses.
  PG_IMAGE: postgres@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
  ETCD_CONTAINER: synod-dev-etcd
  ETCD_PORT: "52379"
  ETCD_PEER_PORT: "52380"
  # Pinned to the digest that scripts/test-etcd.sh uses.
  ETCD_IMAGE: quay.io/coreos/etcd@sha256:dfd3941bf6ced5fdb700f9b2d98b22b7bca7ceee13aec16224f93ff30d9a59c4
  LISTEN: 127.0.0.1:8443

# Configure the agent transport before you set SYNOD_ETCD_ENDPOINTS.
# The local etcd fixture also requires SYNOD_ETCD_ALLOW_PLAINTEXT=true.
# Without etcd, the controller records desired state and starts no worker.
env:
  SYNOD_DATABASE_URL: postgres://postgres@127.0.0.1:{{.PG_PORT}}/synod?sslmode=disable
  SYNOD_ADMIN_TOKEN_FILE: .dev/admin.token
  SYNOD_TLS_CERT_FILE: .dev/api.crt
  SYNOD_TLS_KEY_FILE: .dev/api.key
  SYNOD_PUBLIC_ORIGIN: https://{{.LISTEN}}
  SYNOD_API_URL: https://{{.LISTEN}}
  SYNOD_CA_FILE: .dev/api.crt

tasks:
  default:
    desc: List the available commands
    cmds: [task --list]
    silent: true

  # ---------------------------------------------------------------- build ---

  build:
    desc: Build every binary into dist/
    deps: [build:controller, build:cli, build:agent]

  build:controller:
    desc: Build the controller
    cmds: ["go build -o dist/synodd ./cmd/synodd"]

  build:cli:
    desc: Build the command line
    cmds: ["go build -o dist/synod ./cmd/synod"]

  build:agent:
    desc: Build the node agent
    cmds: ["go build -o dist/synod-agent ./cmd/synod-agent"]

  build:web:
    desc: Build the browser application into internal/web/dist
    dir: web
    cmds:
      - npm install
      - npm run build

  proto:
    desc: Generate the agent protobuf code
    cmds:
      - >-
        protoc
        --go_out=. --go_opt=module=github.com/sirrobot01/synod
        --go-grpc_out=. --go-grpc_opt=module=github.com/sirrobot01/synod
        proto/agent/v1/agent.proto
    preconditions:
      - sh: command -v protoc
        msg: protoc is not installed.
      - sh: command -v protoc-gen-go
        msg: protoc-gen-go is not installed. Run `go install google.golang.org/protobuf/cmd/protoc-gen-go@latest`.
      - sh: command -v protoc-gen-go-grpc
        msg: protoc-gen-go-grpc is not installed. Run `go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest`.

  # ---------------------------------------------------------------- checks ---

  check:
    desc: Run every static check
    deps: [vet, check:web]

  vet:
    desc: Vet the Go code
    cmds: ["go vet ./..."]

  check:web:
    desc: Type-check the browser application
    dir: web
    cmds: ["npm run check"]

  # ----------------------------------------------------------------- tests ---

  test:
    desc: Run the Go tests that need no dependency
    summary: |
      A test that needs PostgreSQL, etcd, or Docker skips itself here.
      Run `task test:all` before you call a stateful change complete.

      Arguments replace the package list, so pass the whole tail:
      task test -- -run TestName ./internal/api/...
    cmds: ['go test {{default "./..." .CLI_ARGS}}']

  test:all:
    desc: Run the whole Go suite with PostgreSQL, etcd, and race detection
    summary: |
      Arguments replace the package list, so pass the whole tail:
      task test:all -- -run TestName ./internal/controller/...
    cmds:
      - ./scripts/test-etcd.sh ./scripts/test-postgres.sh go test -race {{default "./..." .CLI_ARGS}}
    preconditions:
      - sh: docker info
        msg: Docker is not running. The test fixtures need it.

  test:pg:
    desc: 'Run a focused test with PostgreSQL only, for example: task test:pg -- ./internal/store/...'
    summary: |
      Arguments replace the package list, so pass the whole tail:
      task test:pg -- -run TestName ./internal/store/...
    cmds:
      - ./scripts/test-postgres.sh go test -race {{default "./..." .CLI_ARGS}}
    preconditions:
      - sh: docker info
        msg: Docker is not running. The test fixtures need it.

  test:web:
    desc: Run the browser application tests
    dir: web
    cmds: ["npm test -- {{.CLI_ARGS}}"]

  # ------------------------------------------------------------ dev set-up ---

  dev:certs:
    desc: Create the development token, TLS certificate, and installation ID
    summary: |
      These credentials are for one workstation. The certificate is self-signed
      and the database trusts any password, so nothing here is safe anywhere else.
    status:
      - test -s .dev/admin.token
      - test -s .dev/api.crt
      - test -s .dev/installation-id
    cmds:
      - mkdir -p .dev
      - openssl rand -hex 32 > .dev/admin.token
      - chmod 600 .dev/admin.token
      - >-
        openssl req -x509 -newkey rsa:2048 -nodes -days 365
        -keyout .dev/api.key -out .dev/api.crt
        -subj "/CN=synod-dev"
        -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
        2>/dev/null
      - chmod 600 .dev/api.key
      - uuidgen | tr 'A-Z' 'a-z' > .dev/installation-id
      - 'echo "Wrote .dev/. The token, key, and certificate are development-only."'

  dev:up:
    desc: Start the persistent metadata database
    deps: [dev:certs]
    cmds:
      - task: dev:postgres
    preconditions:
      - sh: docker info
        msg: Docker is not running.

  dev:postgres:
    internal: true
    status:
      - test "$(docker inspect -f '{{`{{.State.Running}}`}}' {{.PG_CONTAINER}} 2>/dev/null)" = true
    cmds:
      - docker rm --force {{.PG_CONTAINER}} >/dev/null 2>&1 || true
      - >-
        docker run --detach
        --name {{.PG_CONTAINER}}
        --publish 127.0.0.1:{{.PG_PORT}}:5432
        --volume {{.PG_VOLUME}}:/var/lib/postgresql/data
        --env POSTGRES_HOST_AUTH_METHOD=trust
        --env POSTGRES_DB=synod
        {{.PG_IMAGE}}
      - |
        for attempt in $(seq 30); do
          if docker exec {{.PG_CONTAINER}} pg_isready --host 127.0.0.1 --username postgres --dbname synod >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo 'PostgreSQL did not become ready.' >&2
        exit 1
      - 'echo "PostgreSQL listens on 127.0.0.1:{{.PG_PORT}}."'

  dev:etcd:
    desc: Start the persistent etcd node
    summary: |
      This local development node has no TLS or authentication.
      Configure the controller agent transport before you enable workers.
      Set SYNOD_ETCD_ENDPOINTS to 127.0.0.1:{{.ETCD_PORT}}.
      Set SYNOD_ETCD_ALLOW_PLAINTEXT=true for this fixture.
    status:
      - test "$(docker inspect -f '{{`{{.State.Running}}`}}' {{.ETCD_CONTAINER}} 2>/dev/null)" = true
    cmds:
      - docker rm --force {{.ETCD_CONTAINER}} >/dev/null 2>&1 || true
      - >-
        docker run --detach
        --name {{.ETCD_CONTAINER}}
        --publish 127.0.0.1:{{.ETCD_PORT}}:2379
        {{.ETCD_IMAGE}}
        /usr/local/bin/etcd
        --name synod-dev
        --data-dir /etcd-data
        --listen-client-urls http://0.0.0.0:2379
        --advertise-client-urls http://127.0.0.1:{{.ETCD_PORT}}
        --listen-peer-urls http://127.0.0.1:{{.ETCD_PEER_PORT}}
        --initial-advertise-peer-urls http://127.0.0.1:{{.ETCD_PEER_PORT}}
        --initial-cluster synod-dev=http://127.0.0.1:{{.ETCD_PEER_PORT}}
      - |
        for attempt in $(seq 30); do
          if docker exec {{.ETCD_CONTAINER}} etcdctl --endpoints http://127.0.0.1:2379 endpoint health >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo 'etcd did not become ready.' >&2
        exit 1
      - 'echo "etcd listens on 127.0.0.1:{{.ETCD_PORT}}."'

  dev:down:
    desc: Remove the development containers and keep their data
    cmds:
      - docker rm --force {{.PG_CONTAINER}} {{.ETCD_CONTAINER}} >/dev/null 2>&1 || true
      - 'echo "Removed the development containers. The volume {{.PG_VOLUME}} still holds the metadata."'

  dev:reset:
    desc: Drop the development metadata database and create an empty one
    summary: |
      A changed migration fails the checksum check on an existing database.
      AGENTS.md requires a dropped development database, never a repair migration.
      This command destroys every local cluster record.
    deps: [dev:up]
    cmds:
      # --force ends a running controller's connections. Without it the drop fails
      # whenever `task dev` is open in another terminal, which is the usual case.
      - docker exec {{.PG_CONTAINER}} dropdb --username postgres --if-exists --force synod
      - docker exec {{.PG_CONTAINER}} createdb --username postgres synod
      # etcd holds the elections. It is cleared only when it is running.
      - cmd: docker exec {{.ETCD_CONTAINER}} etcdctl --endpoints http://127.0.0.1:2379 del --prefix /synod >/dev/null 2>&1
        ignore_error: true
      - 'echo "The metadata database is empty. The next start applies the migrations."'

  # ---------------------------------------------------------------- running ---

  dev:
    desc: Run the controller against the development dependencies
    summary: |
      This serves the API and the browser application on https://127.0.0.1:8443.
      It starts no worker, because worker dispatch needs the agent transport.
    deps: [dev:up]
    cmds:
      - 'echo "Open https://{{.LISTEN}} and sign in. The certificate is self-signed, so the browser warns once."'
      - go run ./cmd/synodd --listen {{.LISTEN}} --installation-id "$(cat .dev/installation-id)" {{.CLI_ARGS}}

  dev:web:
    desc: Serve the browser application with hot reload against a running controller
    summary: |
      Run `task dev` in another terminal first.
      This server proxies /v1 to the controller, so the browser keeps one origin
      and the session cookie still reaches the API.
    dir: web
    cmds:
      - npm install
      - npm run dev

  cli:
    desc: 'Run the command line against the development controller, for example: task cli -- db get ID'
    deps: [dev:certs]
    cmds:
      - go run ./cmd/synod --token-file .dev/admin.token {{.CLI_ARGS}}

  dev:user:
    desc: 'Create the first operator account, for example: task dev:user -- alice'
    deps: [dev:certs]
    cmds:
      - |
        if [ -z '{{.CLI_ARGS}}' ]; then
          echo 'Name the account: task dev:user -- alice' >&2
          exit 1
        fi
      - go run ./cmd/synod --token-file .dev/admin.token user create {{.CLI_ARGS}}

  # ---------------------------------------------------------------- tidying ---

  clean:
    desc: Remove the built binaries
    cmds: ["rm -rf dist"]

  clean:all:
    desc: Remove the binaries, the development credentials, and the container data
    prompt: This deletes .dev/ and the local metadata volume. Continue?
    cmds:
      - task: dev:down
      - rm -rf dist .dev
      - docker volume rm {{.PG_VOLUME}} >/dev/null 2>&1 || true
