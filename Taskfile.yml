version: "3"

# Local development commands for Synod.
# Run `task` to list them.
#
# The development installation lives in .dev/. `task dev:init` creates it with
# `synod server init`, and the controller keeps its metadata in .dev/synod.db.

vars:
  LISTEN: 127.0.0.1:8443

env:
  SYNOD_API_URL: https://{{.LISTEN}}
  SYNOD_CA_FILE: .dev/api-ca.crt
  SYNOD_ADMIN_TOKEN_FILE: .dev/admin.token

tasks:
  default:
    desc: List the available commands
    cmds: [task --list]
    silent: true

  # ---------------------------------------------------------------- build ---

  build:
    desc: Build the synod binary into dist/
    cmds: ["go build -o dist/synod ./cmd/synod"]

  release:
    desc: Build versioned Linux amd64 and arm64 release files
    cmds: ['sh scripts/build-release.sh {{.CLI_ARGS}}']

  test:install:
    desc: Test verified installation with disposable files
    cmds: ['python3 scripts/test-install.py']

  build:web:
    desc: Build the browser application into internal/web/dist
    dir: web
    cmds:
      - npm install
      - npm run build

  proto:
    desc: Generate the agent protobuf code
    cmds:
      - >-
        protoc
        --go_out=. --go_opt=module=github.com/sirrobot01/synod
        --go-grpc_out=. --go-grpc_opt=module=github.com/sirrobot01/synod
        proto/agent/v1/agent.proto
    preconditions:
      - sh: command -v protoc
        msg: protoc is not installed.
      - sh: command -v protoc-gen-go
        msg: protoc-gen-go is not installed. Run `go install google.golang.org/protobuf/cmd/protoc-gen-go@latest`.
      - sh: command -v protoc-gen-go-grpc
        msg: protoc-gen-go-grpc is not installed. Run `go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest`.

  # ---------------------------------------------------------------- checks ---

  check:
    desc: Run every static check
    deps: [vet, check:web]

  vet:
    desc: Vet the Go code
    cmds: ["go vet ./..."]

  check:web:
    desc: Type-check the browser application
    dir: web
    cmds: ["npm run check"]

  # ----------------------------------------------------------------- tests ---

  test:
    desc: Run the Go test suite with race detection, one package at a time
    summary: |
      A test that needs Docker skips itself unless SYNOD_TEST_DOCKER_HOST is set.
      Arguments replace the package list, so pass the whole tail:
      task test -- -run TestName ./internal/api/...
    cmds: ['go test -race -p 1 {{default "./..." .CLI_ARGS}}']

  test:web:
    desc: Run the browser application tests
    dir: web
    cmds: ["npm test -- {{.CLI_ARGS}}"]

  # ------------------------------------------------------------ dev set-up ---

  dev:init:
    desc: Create the development installation in .dev/
    summary: |
      The material in .dev/ is for one workstation. Never use it anywhere else.
    status:
      - test -s .dev/controller.json
    cmds:
      - go run ./cmd/synod server init --dir .dev --address 127.0.0.1 --systemd-dir .dev/no-systemd

  dev:reset:
    desc: Delete the development installation
    summary: |
      A changed migration fails the checksum check on an existing database.
      AGENTS.md requires a new development database, never a repair migration.
      This command destroys every local metadata record and the installation material.
    prompt: This deletes .dev/. Continue?
    cmds:
      - rm -rf .dev
      - 'echo "Run task dev:init to create a new installation."'

  # ---------------------------------------------------------------- running ---

  dev:
    desc: Run the controller of the development installation
    summary: |
      This serves the API and the browser application on https://127.0.0.1:8443,
      and the agent transport on 127.0.0.1:8444.
    deps: [dev:init]
    cmds:
      - 'echo "Open https://{{.LISTEN}} and sign in. The certificate is self-signed, so the browser warns once."'
      - go run ./cmd/synod server --config .dev/controller.json --public-origin https://{{.LISTEN}} {{.CLI_ARGS}}

  dev:web:
    desc: Serve the browser application with hot reload against a running controller
    summary: |
      Run `task dev` in another terminal first.
      This server proxies /v1 to the controller, so the browser keeps one origin
      and the session cookie still reaches the API.
    dir: web
    cmds:
      - npm install
      - npm run dev

  cli:
    desc: 'Run the command line against the development controller, for example: task cli -- node list'
    deps: [dev:init]
    cmds:
      - go run ./cmd/synod {{.CLI_ARGS}}

  dev:user:
    desc: 'Create the first operator account, for example: task dev:user -- alice'
    deps: [dev:init]
    cmds:
      - |
        if [ -z '{{.CLI_ARGS}}' ]; then
          echo 'Name the account: task dev:user -- alice' >&2
          exit 1
        fi
      - go run ./cmd/synod user create {{.CLI_ARGS}}

  # ---------------------------------------------------------------- tidying ---

  clean:
    desc: Remove the built binaries
    cmds: ["rm -rf dist"]
