syntax = "proto3";

package synod.agent.v1;
option go_package = "github.com/sirrobot01/synod/proto/agent/v1;agentv1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// The agent opens this stream over mTLS. Certificate identity binds its node ID.
service AgentService {
  rpc Connect(stream AgentMessage) returns (stream ControllerMessage);
}

message VersionRange { uint32 minimum = 1; uint32 maximum = 2; }

// Hello opens a session. The facts in it are what the agent measured on its host.
message Hello {
  string installation_id = 1;
  string node_id = 2;
  VersionRange protocol = 3;
  repeated string capabilities = 4;
  string runtime_version = 5;
  string architecture = 6;
  string hostname = 7;
  string agent_version = 8;
}

message Session {
  uint32 protocol_version = 1;
  string session_id = 2;
  google.protobuf.Duration heartbeat_interval = 3;
  google.protobuf.Duration stale_after = 4;
  uint32 max_message_bytes = 5;
  uint32 max_queued_messages = 6;
  repeated string capabilities = 7;
}

message Heartbeat {
  uint64 sequence = 1;
  google.protobuf.Timestamp observed_at = 2;
}

message ProtocolError { string code = 1; string message = 2; }

message AgentMessage {
  oneof message {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    AppInventory inventory = 3;
    DestinationAck destination_ack = 4;
  }
}

message ControllerMessage {
  oneof message {
    Session session = 1;
    ProtocolError error = 2;
    DestinationPlan destination_plan = 3;
  }
}

// An inventory is complete. A failed scan has a failure code and no apps.
message AppInventory {
  google.protobuf.Timestamp observed_at = 1;
  repeated DiscoveredApp apps = 2;
  string failure_code = 3;
}

// Discovery contains metadata only. It never carries file or environment contents.
message DiscoveredApp {
  string key = 1;
  string name = 2;
  string kind = 3;
  string project_directory = 4;
  repeated DiscoveredContainer containers = 5;
  repeated DiscoveredPath paths = 6;
  repeated string issues = 7;
}

message DiscoveredContainer {
  string id = 1;
  string name = 2;
  string service = 3;
  string image = 4;
  string image_id = 5;
  repeated string repo_digests = 6;
  string platform = 7;
  string state = 8;
  string database = 9;
}

message DiscoveredPath {
  string source = 1;
  string target = 2;
  string kind = 3;
  string volume = 4;
  string container_id = 5;
  string status = 6;
  string reason = 7;
  int64 size_bytes = 8;
  bool size_known = 9;
  bool read_only = 10;
}

// The private JSON payload holds destination.Plan. Never log this message.
message DestinationPlan { bytes settings_json = 1; }
// The agent sends this only after its encrypted local transaction commits.
message DestinationAck { int64 revision = 1; }
