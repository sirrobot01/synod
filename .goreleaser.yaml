version: 2

# Build the release from a version tag. The web UI in internal/web/dist is committed.
project_name: synod

builds:
  - id: synod
    main: ./cmd/synod
    binary: synod
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -buildid=
      - -X github.com/sirrobot01/synod/internal/buildinfo.Version={{ .Tag }}
      - -X github.com/sirrobot01/synod/internal/buildinfo.Revision={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# install.sh downloads synod-OS-ARCH and SHA256SUMS from the release.
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

# The agent image for hosts without systemd, such as Unraid and Synology.
dockers_v2:
  - id: agent
    ids: [synod]
    dockerfile: Dockerfile
    images: ["ghcr.io/sirrobot01/synod"]
    tags: ["{{ .Tag }}", "{{ if not .Prerelease }}latest{{ end }}"]
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/sirrobot01/synod
      org.opencontainers.image.version: "{{ .Tag }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

release:
  extra_files:
    - glob: ./install.sh

changelog:
  use: github
